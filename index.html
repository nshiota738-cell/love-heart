<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0;padding:0}</style>
<title>Love You Heart</title>
<style>
/* Layout: one full-screen canvas; a heart assembled from glowing "love you" words, then an "I Love You" finale. */
:root {
  --bg: #02040b;
  --glow: #3d8bff;
  --word: #9cc7ff;
  --hot: #e8f2ff;
  --font-display: "Playfair Display", Georgia, serif;
  --font-word: "Space Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--hot); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hint {
  position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  text-align: center; font: 12px/1 var(--font-word); letter-spacing: .18em; text-transform: uppercase;
  color: var(--word); opacity: 0; transition: opacity 1.2s;
}
.hint.on { opacity: .55; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Space+Mono:wght@400;700&display=swap">
<canvas id="c" aria-label="Glowing heart made of the words love you"></canvas>
<div class="hint" id="hint">tap to replay</div>
<script>
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d'), hint = document.getElementById('hint');
  var W, H, dpr, parts, t0, cx, cy, S, mobile;
  var WORDS = ['LOVE YOU', 'Love You', 'love you', 'LOVE YOU', 'Love you'];
  var ptr = { x: -999, y: -999 };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function heartPt(t) {
    return [16 * Math.pow(Math.sin(t), 3),
      -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))];
  }
  function inHeart(x, y) { // implicit heart curve, x,y in heart units /16
    var a = x * x + y * y - 1;
    return a * a * a - x * x * y * y * y <= 0;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    mobile = W < 600;
    cx = W / 2; cy = H * (mobile ? 0.42 : 0.47);
    S = Math.min(W / 38, H / 34); // pixels per heart unit
  }

  function build() {
    parts = [];
    var n = mobile ? 230 : 380, ne = mobile ? 80 : 130, tries = 0, e = 0, f = 0;
    while ((f < n || e < ne) && tries++ < 60000) {
      var x = (Math.random() * 2 - 1) * 1.2, y = Math.random() * 2.5 - 1.15;
      if (!inHeart(x, y)) continue;
      var edge = !inHeart(x / 0.9, (y - 0.12) / 0.9 + 0.12);
      if (edge && e < ne) { parts.push(mk(x, -y + 0.1, 'heart', true)); e++; }
      else if (!edge && f < n) { parts.push(mk(x, -y + 0.1, 'heart', false)); f++; }
    }
    // sweep the reveal from the top-left, around the heart
    parts.forEach(function (p) {
      var ang = Math.atan2(p.hy, p.hx);
      p.delay = 0.4 + ((ang + Math.PI) / (Math.PI * 2)) * 4.5 + Math.random() * 2.2;
    });
    // finale field of words across the whole screen
    var m = mobile ? 90 : 170;
    for (var j = 0; j < m; j++) {
      var q = mk(0, 0, 'field');
      q.fx = Math.random() * W; q.fy = Math.random() * H;
      q.delay = 10 + Math.random() * 3.5;
      parts.push(q);
    }
  }

  function mk(hx, hy, kind, edge) {
    return {
      kind: kind, hx: hx, hy: hy, edge: !!edge,
      word: WORDS[(Math.random() * WORDS.length) | 0],
      size: (mobile ? 8 : 10) + Math.random() * (mobile ? 9 : 12),
      rot: (Math.random() - 0.5) * 0.7,
      ph: Math.random() * 6.28, fs: 2 + Math.random() * 4,
      ox: 0, oy: 0, vx: 0, vy: 0,
      drift: Math.random() * 6.28, delay: 0
    };
  }

  function start() { t0 = performance.now(); hint.classList.remove('on'); }

  function frame(now) {
    var t = (now - t0) / 1000;
    ctx.fillStyle = '#02040b';
    ctx.fillRect(0, 0, W, H);

    var beat = reduce ? 1 : 1 + 0.035 * Math.pow(Math.sin(t * 2.6), 6) * 2 + 0.012 * Math.sin(t * 1.3);
    var heartFade = t < 9 ? 1 : Math.max(0.35, 1 - (t - 9) * 0.2);

    // finale text, small, drawn behind the words
    if (t > 11) {
      var fa = Math.min(1, (t - 11) / 2.2);
      var fs = Math.min(W * 0.085, 40);
      ctx.save();
      ctx.shadowColor = '#3d8bff';
      ctx.shadowBlur = 14;
      ctx.globalAlpha = fa * 0.7;
      ctx.font = 'italic 600 ' + fs + 'px "Playfair Display", Georgia, serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#cfe1ff';
      ctx.fillText('I Love You', cx, cy);
      ctx.restore();
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#3d8bff';

    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      var age = t - p.delay;
      if (age < 0) continue;
      var a = Math.min(1, age / 1.2);
      var x, y;
      if (p.kind === 'heart') {
        var rise = Math.min(1, age / 1.4);
        x = cx + p.hx * 13.5 * S * 1.0 * beat;
        y = cy + p.hy * 13.5 * S * 1.0 * beat;
        y += (1 - rise) * 24;
        x += Math.sin(t * 0.8 + p.drift) * 1.2;
        y += Math.cos(t * 0.7 + p.drift) * 1.2;
        a *= heartFade;
      } else {
        x = p.fx + Math.sin(t * 0.4 + p.drift) * 6;
        y = p.fy + Math.cos(t * 0.35 + p.drift) * 6;
        a *= 0.75;
      }
      // pointer push
      var dx = x - ptr.x, dy = y - ptr.y, d2 = dx * dx + dy * dy, R = 90;
      if (d2 < R * R) {
        var d = Math.sqrt(d2) || 1, f = (1 - d / R) * 2.2;
        p.vx += dx / d * f; p.vy += dy / d * f;
      }
      p.vx *= 0.9; p.vy *= 0.9;
      p.ox += p.vx; p.oy += p.vy;
      p.ox *= 0.96; p.oy *= 0.96;
      x += p.ox; y += p.oy;

      var flick = reduce ? 1 : 0.65 + 0.35 * Math.sin(t * p.fs + p.ph);
      var alpha = a * flick;
      if (alpha <= 0.02) continue;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(p.rot);
      ctx.font = (p.edge ? '700 ' : '400 ') + p.size + 'px "Space Mono", ui-monospace, Menlo, monospace';
      ctx.globalAlpha = Math.min(1, alpha);
      ctx.shadowBlur = p.size * (p.edge ? 1.1 : 0.8);
      ctx.fillStyle = (p.edge || flick > 0.95) ? '#e8f2ff' : '#7fb4ff';
      ctx.fillText(p.word, 0, 0);
      ctx.restore();
    }

    if (t > 15) hint.classList.add('on');
    requestAnimationFrame(frame);
  }

  function move(e) {
    var p = e.touches ? e.touches[0] : e;
    if (p) { ptr.x = p.clientX; ptr.y = p.clientY; }
  }
  addEventListener('pointermove', move);
  addEventListener('touchmove', move, { passive: true });
  addEventListener('touchstart', move, { passive: true });
  function leave() { ptr.x = ptr.y = -999; }
  addEventListener('pointerup', leave); addEventListener('touchend', leave);
  addEventListener('pointerleave', leave);
  document.body.addEventListener('click', function () { if ((performance.now() - t0) / 1000 > 15) { build(); start(); } });
  addEventListener('resize', function () { resize(); build(); });

  function boot() { resize(); build(); start(); requestAnimationFrame(frame); }
  if (document.fonts && document.fonts.load) {
    Promise.race([
      Promise.all([document.fonts.load('400 14px "Space Mono"'), document.fonts.load('italic 600 40px "Playfair Display"')]),
      new Promise(function (r) { setTimeout(r, 1200); })
    ]).then(boot, boot);
  } else boot();
})();
</script>

</body>
</html>
